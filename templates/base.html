<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Centro de Capacitación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">CENTRO DE CAPACITACIÓN</a>
            <div>
                <a class="nav-link d-inline px-2 {% if request.endpoint == 'lista_estudiantes' or request.endpoint == 'nuevo_estudiante' or request.endpoint == 'editar_estudiante' %}text-warning fw-bold{% else %}text-white{% endif %}" 
                   href="{{ url_for('lista_estudiantes') }}">Estudiantes</a>
                <a class="nav-link d-inline px-2 {% if request.endpoint == 'lista_cursos' or request.endpoint == 'nuevo_curso' or request.endpoint == 'editar_curso' %}text-warning fw-bold{% else %}text-white{% endif %}" 
                   href="{{ url_for('lista_cursos') }}">Cursos</a>
                <a class="nav-link d-inline px-2 {% if request.endpoint == 'lista_inscripciones' or request.endpoint == 'nueva_inscripcion' or request.endpoint == 'editar_inscripcion' %}text-warning fw-bold{% else %}text-white{% endif %}" 
                   href="{{ url_for('lista_inscripciones') }}">Inscripciones</a>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block contenido %}{% endblock %}
    </div>
</body>
</html>
