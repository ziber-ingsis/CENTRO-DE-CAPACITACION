{% extends "base.html" %}
{% block contenido %}
<h1>Cursos</h1>
<a href="{{ url_for('nuevo_curso') }}" class="btn btn-success mb-3">Nuevo Curso</a>
<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr><th>ID</th><th>Nombre del Curso</th><th>Duración (h)</th><th>Precio (Bs)</th><th>Acciones</th></tr>
    </thead>
    <tbody>
        {% for c in cursos %}
        <tr>
            <td>{{ c.id }}</td>
            <td>{{ c.nombre_curso }}</td>
            <td>{{ c.duracion_horas }}</td>
            <td>{{ c.precio }}</td>
            <td>
                <a href="{{ url_for('editar_curso', id=c.id) }}" class="btn btn-warning btn-sm">Editar</a>
                <a href="{{ url_for('eliminar_curso', id=c.id) }}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
