{% extends "base.html" %}
{% block contenido %}
<h1>Estudiantes</h1>
<a href="{{ url_for('nuevo_estudiante') }}" class="btn btn-success mb-3">Nuevo Estudiante</a>
<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Correo</th><th>Teléfono</th><th>Acciones</th></tr>
    </thead>
    <tbody>
        {% for e in estudiantes %}
        <tr>
            <td>{{ e.id }}</td>
            <td>{{ e.nombre }}</td>
            <td>{{ e.apellido }}</td>
            <td>{{ e.correo }}</td>
            <td>{{ e.telefono }}</td>
            <td>
                <a href="{{ url_for('editar_estudiante', id=e.id) }}" class="btn btn-warning btn-sm">Editar</a>
                <a href="{{ url_for('eliminar_estudiante', id=e.id) }}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
